[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapsnap-cli"
version = "1.1.0"
description = "Georeferencing tools for historical maps"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "easyocr>=1.7.2",
    "numpy>=2.0",
    "opencv-python>=4.13.0.92",
    "osmium>=4.3.1",
    "pillow>=12.2.0",
    "shapely>=2.0",
    "torch>=2.12,<2.13",
    "torchvision>=0.27,<0.28",
    "tqdm>=4.67.1",
]

[project.scripts]
mapsnap = "mapsnap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mapsnap"]

[tool.ruff]
line-length = 88

[tool.pyright]
# torch re-exports many names (device, tensor, sigmoid, ...) without listing them in
# __all__, which pyright otherwise flags as private-import usage on every call.
reportPrivateImportUsage = false

[dependency-groups]
dev = [
    # scripts/batch/missing-items.py only; the aws CLI cannot do 33,000 HEADs
    # in reasonable time, and this is not imported by anything the corpus image
    # runs, so it stays out of the runtime dependencies.
    "boto3>=1.35",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "ruff>=0.16,<0.17",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

# torch from the PyTorch CPU index on Linux. PyPI's Linux wheel is the CUDA
# build -- 4.6 GB of nvidia-*, triton and libtorch_cuda in the corpus image,
# measured 2026-09-18 -- and the CPU chain (loc-fit) never uses a device. The
# CPU wheel is 183 MB. macOS is unaffected (PyPI's Mac wheel has no CUDA), and a
# GPU image sets --build-arg TORCH_INDEX to a CUDA index, which reinstalls over
# this (see Dockerfile); bootstrap.sh does the same on an instance with a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
